[package]
name = "unwrap_staking"
version = "0.1.0"
edition = "2024_07"
description = "Unwrap Labs rewards handler + factory for Starknet staking delegators"
license = "MIT"

[dependencies]
starknet = "2.17.0"

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.17.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[profile.release]
